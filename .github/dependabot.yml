# Keeps dependencies and CI actions current.
#
# The configuration is read from the default branch only: updates start
# arriving once this file is on `main`.
version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'

  - package-ecosystem: 'pub'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    ignore:
      # Pinned on purpose: newer releases require Flutter >= 3.44 while this
      # project targets 3.41 (see the note in pubspec.yaml). Bumping either of
      # them makes the build fail, so dependabot must not even propose it.
      - dependency-name: 'torch_light'
      - dependency-name: 'wakelock_plus'
